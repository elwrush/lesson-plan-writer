            /* =============================================
               LESSON PLAN WRITER 3 — BASE SLIDE STYLES
               Authoritative stylesheet for all presentations.
               ============================================= */

            /* --- CEFR Badges --- */
            .cefr-badge {
                display: inline-block;
                color: white;
                font-weight: bold;
                font-size: 0.7em;
                padding: 4px 12px;
                border-radius: 4px;
                vertical-align: middle;
                position: relative;
                top: -2px;
            }
            .reveal .title-logo {
                display: block;
                max-height: 100px;
                margin: 0 auto 1em;
            }

            .reveal .a-badge {
                display: inline-block;
                padding: 0.1em 0.5em;
                border-radius: 4px;
                font-weight: bold;
                font-size: 0.85em;
                min-width: 1.8em;
                text-align: center;
            }
            .reveal .a-badge.a-cor {
                background: rgba(76, 175, 80, 0.4);
                color: #fff;
            }
            .reveal .a-badge.a-inc {
                background: rgba(244, 67, 54, 0.4);
                color: #fff;
            }

                font-size: 0.4em;
                vertical-align: middle;
                margin-left: 10px;
            }
            .cefr-badge.A1 { background: #4caf50; }
            .cefr-badge.A2 { background: #8bc34a; }
            .cefr-badge.B1 { background: #2196f3; }
            .cefr-badge.B2 { background: #2a76dd; }
            .cefr-badge.C1 { background: #9c27b0; }
            .cefr-badge.C2 { background: #f44336; }


            /* --- Answer flex layout (replaces answer-table) --- */
            .reveal .answer-list {
                width: 100%;
                font-size: 0.85em;
            }
            .reveal .a-row {
                display: flex;
                align-items: baseline;
                padding: 0.4em 0;
                border-bottom: 1px solid rgba(255,255,255,0.1);
                gap: 0.5em;
            }
            .reveal .a-row:last-child { border-bottom: none; }
            .reveal .a-num {
                flex: 0 0 1.5em;
                text-align: right;
                color: rgba(255,255,255,0.5);
                font-size: 0.85em;
            }
            .reveal .a-q {
                flex: 0 1 auto;
                min-width: 0;
                margin-right: 1em;
            }
            .reveal .a-ans {
                flex: 0 0 auto;
                min-width: 180px;
                text-align: left;
                padding: 0.1em 0.3em;
                border-radius: 4px;
            }
            .reveal .a-ans.a-cor {
                color: #fff;
            }
            .reveal .a-ans.a-cor.visible {
                background: rgba(76, 175, 80, 0.3);
            }
            .reveal .a-ans.a-inc {
                color: #fff;
            }
            .reveal .a-ans.a-inc.visible {
                background: rgba(244, 67, 54, 0.3);
            }

            /* --- Labels & captions --- */
            .reveal .aim-label {
                font-size: 0.7em;
                color: #888;
                text-transform: uppercase;
                letter-spacing: 0.1em;
            }
            .reveal .material-ref {
                font-size: 0.65em;
                color: #888;
                font-style: italic;
                margin-top: 0.5em;
            }
            .reveal .source-cite {
                font-size: 0.7em;
                color: #666;
                font-style: italic;
                margin-top: 0.3em;
            }
            .reveal .image-caption {
                font-size: 0.55em;
                color: #888;
                text-align: center;
                margin-top: 0.2em;
            }

            /* --- Vocabulary slides --- */
            .reveal section.vocab-slide h2 { font-size: 2.2em; }
            .reveal section.vocab-slide p  { font-size: 1.3em; line-height: 1.4; }
            .reveal .vocab-word {
                color: #ffdd00;
                font-weight: bold;
                text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
            }

            /* --- Pedagogical strategy slides (teal background) --- */
            .reveal section.pedagogical { text-shadow: none; }
            .reveal section.pedagogical p,
            .reveal section.pedagogical li,
            .reveal section.pedagogical h1, .reveal section.pedagogical h2,
            .reveal section.pedagogical h3, .reveal section.pedagogical h4,
            .reveal section.pedagogical h5, .reveal section.pedagogical h6 {
                text-shadow: none;
            }
            .reveal section.pedagogical h2 {
                color: #fff;
                border-bottom: 3px solid rgba(255,255,255,0.3);
                padding-bottom: 0.3em;
            }
            .reveal section.pedagogical h3 { color: #fff; }
            .reveal section.pedagogical p  { color: #fff; }
            .reveal section.pedagogical li { color: #fff; }
            .reveal section.pedagogical .strategy-tip {
                font-size: 0.85em;
                font-style: italic;
                color: rgba(255,255,255,0.85);
                margin-bottom: 0.5em;
            }
            .reveal section.pedagogical .evidence {
                font-size: 0.8em;
                background: rgba(0,0,0,0.3);
                padding: 0.4em 0.6em;
                border-radius: 4px;
                border-left: 3px solid rgba(255,255,255,0.4);
            }

            /* --- Global text shadow for readability --- */
            .reveal p,
            .reveal li,
            .reveal h1, .reveal h2, .reveal h3,
            .reveal h4, .reveal h5, .reveal h6 {
                text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
            }

            /* --- Text shield for full-opacity image backgrounds --- */
            /* Uses display:inline-block + max-width for subtitle-style shielding.
               inline-block keeps the background tight to the text.
               max-width prevents full-width bars on very long text.
               Elements stack naturally (block-level spacing) without ::after artifacts. */
            .reveal .text-shield {
                background: rgba(0, 0, 0, 0.55);
                padding: 0.15em 0.6em;
                border-radius: 4px;
                display: inline-block;
                max-width: 90%;
                text-shadow: none;
                line-height: 1.6;
            }
            .reveal .text-shield-light {
                background: rgba(200, 200, 200, 0.65);
                padding: 0.15em 0.6em;
                border-radius: 4px;
                display: inline-block;
                max-width: 90%;
                text-shadow: none;
                color: #222;
                line-height: 1.6;
            }
            /* Fragment variant: text already visible, background highlight on click */
            .reveal .fragment.text-shield-light { opacity: 1; visibility: inherit; }
            .reveal .fragment.text-shield-light.visible { background: rgba(200, 200, 200, 0.65); padding: 0.15em 0.6em; border-radius: 4px; }

            /* --- Fragment styles --- */
            /* --- Yellow text for answers on green answer tables --- */
            .reveal .answer-yellow { color: #ffdd00; }
            .reveal .fragment.answer-yellow.visible { color: #ffdd00; }

            .reveal .fragment.highlight-green {
                background: rgba(0, 100, 0, 0.4);
                padding: 0.3em 0.5em;
                border-radius: 4px;
            }
            .reveal .fragment.highlight-red {
                background: rgba(100, 0, 0, 0.4);
                padding: 0.3em 0.5em;
                border-radius: 4px;
            }
            .reveal .fragment.answer-correct.visible {
                background: rgba(0, 120, 0, 0.5);
                padding: 0.3em 0.5em;
                border-radius: 4px;
            }
            .reveal .fragment.answer-incorrect.visible {
                background: rgba(120, 0, 0, 0.5);
                padding: 0.3em 0.5em;
                border-radius: 4px;
            }
            .reveal table.answer-table th {
                background: rgba(0, 0, 0, 0.2);
                font-weight: bold;
            }
            .reveal .fragment.strike {
                text-decoration: line-through;
                opacity: 0.6;
            }

            /* --- YouTube iframe container (16:9 responsive) --- */
            .reveal .iframe-container {
                position: relative;
                width: 90%;
                padding-bottom: 50.625%;
                height: 0;
                overflow: hidden;
                margin: 0 auto 0.5em;
            }
            .reveal .iframe-container iframe {
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                border: none;
            }

            /* --- Diagnostic talk structure slides (pedagogical, teal) --- */
            .reveal .structure-talk h2 {
                color: #fff;
                border-bottom: 3px solid rgba(255,255,255,0.3);
                padding-bottom: 0.3em;
            }
            .reveal .structure-talk p,
            .reveal .structure-talk li  { color: #fff; }
            .reveal .structure-talk .structure-step {
                font-size: 1.1em;
                margin-bottom: 0.6em;
            }
            .reveal .structure-talk .transition-words {
                font-size: 0.9em;
                color: #ffdd00;
                font-style: italic;
                margin-top: 0.8em;
                padding: 0.4em 0.6em;
                background: rgba(0,0,0,0.2);
                border-radius: 4px;
            }
        </style>
