[project]
name = "lesson-plan-writer"
version = "3.0.0"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "pymupdf>=1.28.0",
    "pypdf2>=3.0.1",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.11",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"scripts/json_to_markdown.py" = ["F841"]
"tavily_search.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"

